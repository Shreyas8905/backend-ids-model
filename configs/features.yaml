schema_version: "1.0"
feature_version: backend-features-v1
windowing:
  primary_window_seconds: 10
  burst_bucket_seconds: 1
  rolling_context_seconds: 60
  late_event_grace_ms: 500
  temporal_features:
    causal_only: true
    ewma_alpha: 0.3
    zscore_epsilon: 0.000001
    minimum_prior_windows: 6
profiles:
  backend_full_v1:
    required_groups: [network, application, host]
  backend_partial_v1:
    required_groups: [network, host]
feature_status_values: [available, partial, unavailable, invalid]
features:
  network:
    inbound_bytes_rate:
      unit: bytes_per_second
      required_for_profiles: []
    outbound_bytes_rate:
      unit: bytes_per_second
      required_for_profiles: []
    inbound_packets_rate:
      unit: packets_per_second
      required_for_profiles: []
    outbound_packets_rate:
      unit: packets_per_second
      required_for_profiles: []
    active_connections:
      unit: count
      required_for_profiles: []
    new_connections_rate:
      unit: connections_per_second
      required_for_profiles: []
    failed_connections_rate:
      unit: connections_per_second
      required_for_profiles: []
    connection_failure_ratio:
      unit: ratio
      required_for_profiles: []
    unique_peer_estimate:
      unit: count
      required_for_profiles: []
    unique_destination_ports:
      unit: count
      required_for_profiles: []
    unique_destination_ips:
      unit: count
      required_for_profiles: []
    inbound_outbound_ratio:
      unit: ratio
      required_for_profiles: []
    tcp_reset_rate:
      unit: events_per_second
      required_for_profiles: []
    tcp_retransmission_rate:
      unit: events_per_second
      required_for_profiles: []
    mean_connection_duration:
      unit: seconds
      required_for_profiles: []
    p95_connection_duration:
      unit: seconds
      required_for_profiles: []
  application:
    request_rate:
      unit: requests_per_second
      required_for_profiles: []
    error_rate:
      unit: requests_per_second
      required_for_profiles: []
    http_4xx_rate:
      unit: responses_per_second
      required_for_profiles: []
    http_5xx_rate:
      unit: responses_per_second
      required_for_profiles: []
    p50_request_latency_ms:
      unit: milliseconds
      required_for_profiles: []
    p95_request_latency_ms:
      unit: milliseconds
      required_for_profiles: []
    p99_request_latency_ms:
      unit: milliseconds
      required_for_profiles: []
    active_requests:
      unit: count
      required_for_profiles: []
    request_body_bytes_rate:
      unit: bytes_per_second
      required_for_profiles: []
    response_body_bytes_rate:
      unit: bytes_per_second
      required_for_profiles: []
    unique_route_count:
      unit: count
      required_for_profiles: []
    authentication_failure_rate:
      unit: events_per_second
      required_for_profiles: []
    http_get_ratio:
      unit: ratio
      required_for_profiles: []
    http_post_ratio:
      unit: ratio
      required_for_profiles: []
    http_put_ratio:
      unit: ratio
      required_for_profiles: []
    http_delete_ratio:
      unit: ratio
      required_for_profiles: []
    http_other_method_ratio:
      unit: ratio
      required_for_profiles: []
    http_2xx_ratio:
      unit: ratio
      required_for_profiles: []
    http_3xx_ratio:
      unit: ratio
      required_for_profiles: []
    http_4xx_ratio:
      unit: ratio
      required_for_profiles: []
    http_5xx_ratio:
      unit: ratio
      required_for_profiles: []
  host:
    cpu_utilization:
      unit: ratio
      required_for_profiles: []
    memory_utilization:
      unit: ratio
      required_for_profiles: []
    process_creation_rate:
      unit: processes_per_second
      required_for_profiles: []
    process_termination_rate:
      unit: processes_per_second
      required_for_profiles: []
    unique_executable_count:
      unit: count
      required_for_profiles: []
    unexpected_executable_count:
      unit: count
      required_for_profiles: []
    privileged_process_count:
      unit: count
      required_for_profiles: []
    oom_event_count:
      unit: count
      required_for_profiles: []
    container_restart_count:
      unit: count
      required_for_profiles: []
  temporal:
    request_rate_change:
      unit: ratio
      required_for_profiles: []
    error_rate_change:
      unit: ratio
      required_for_profiles: []
    inbound_rate_change:
      unit: ratio
      required_for_profiles: []
    outbound_rate_change:
      unit: ratio
      required_for_profiles: []
    connection_rate_change:
      unit: ratio
      required_for_profiles: []
    request_rate_ewma:
      unit: requests_per_second
      required_for_profiles: []
    connection_rate_ewma:
      unit: connections_per_second
      required_for_profiles: []
    request_rate_zscore:
      unit: zscore
      required_for_profiles: []
    latency_zscore:
      unit: zscore
      required_for_profiles: []
    connection_burst_score:
      unit: score
      required_for_profiles: []
    error_burst_score:
      unit: score
      required_for_profiles: []
